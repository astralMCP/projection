<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-labelledby="t">
  <title id="t">astralMCP / projection</title>
  <defs>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 44px; }
    .org { fill: #8b5cf6; font-weight: 700; animation: fade 0.8s ease-out 0.2s both; }
    .sep { fill: #8b949e; font-weight: 300; animation: fade 0.5s ease-out 0.9s both; }
    .rep { fill: #0891b2; font-weight: 600; }
    .rep tspan { animation: fade 0.35s ease-out both; }
    .star { transform-box: fill-box; transform-origin: center; animation: pop 0.6s cubic-bezier(.3,1.6,.6,1) both, twinkle 4s ease-in-out 0.6s infinite; }
    .spark { fill: #8b5cf6; animation: blink 3s ease-in-out infinite; }
    .beam { opacity: 0; animation: beam 7s ease-in-out 2.2s infinite; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
    @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.18) rotate(45deg); } }
    @keyframes blink { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    @keyframes beam { 0%, 100% { opacity: 0; } 15%, 45% { opacity: 1; } 60% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      *, .rep tspan { animation: none !important; }
    }
  </style>
  <polygon class="beam" points="44,60 640,14 640,106" fill="url(#beam)"/>
  <path class="star" fill="#8b5cf6" d="M36 34 L41 55 L62 60 L41 65 L36 86 L31 65 L10 60 L31 55 Z"/>
  <circle class="spark" cx="62" cy="30" r="2.5"/>
  <circle class="spark" cx="14" cy="92" r="2" style="animation-delay:1.5s"/>
  <text x="80" y="75"><tspan class="org">astralMCP</tspan><tspan class="sep"> / </tspan><tspan class="rep"><tspan style="animation-delay:1.10s">p</tspan><tspan style="animation-delay:1.18s">r</tspan><tspan style="animation-delay:1.26s">o</tspan><tspan style="animation-delay:1.34s">j</tspan><tspan style="animation-delay:1.42s">e</tspan><tspan style="animation-delay:1.50s">c</tspan><tspan style="animation-delay:1.58s">t</tspan><tspan style="animation-delay:1.66s">i</tspan><tspan style="animation-delay:1.74s">o</tspan><tspan style="animation-delay:1.82s">n</tspan></tspan></text>
</svg>
