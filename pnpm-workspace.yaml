packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  # The sqlite3 native binding behind the mcp-sqlite smoke-test server.
  sqlite3: true
  mcp-sqlite: false
  # The harness's MongoDB tier: the mongodb driver's optional native addons
  # are unused, and mongodb-memory-server fetches the pinned mongod at
  # runtime (MONGODB_VERSION in packages/harness/src/eval/mongodb-world.ts).
  kerberos: false
  mongodb-client-encryption: false
  mongodb-memory-server: false
